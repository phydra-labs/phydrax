[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build]
exclude = [
  ".venv/**",
  ".uv/**",
  ".uv-cache/**",
  ".pytest_cache/**",
  ".ruff_cache/**",
  "**/__pycache__/**",
  ".DS_Store",
]

[project]
authors = [
  {email = "leonard@phydra.ai", name = "Phydra Labs"}
]
name = "phydrax"
version = "0.2.2"
requires-python = ">=3.11,<3.14"
license-files = ["LICENSE", "LICENSES/*", "NOTICE"]

dependencies = [
    "asdex>=0.5.1,<0.5.2",
    "arviz>=0.23.4",
    "blackjax>=1.6.2,<1.7",
    "build123d>=0.10.0",
    "chex>=0.1.91",
    "coordax==0.2.3",
    "diffrax>=0.7.2,<0.8",
    "equinox==0.13.2",
    "evosax>=0.2.0,<0.3",
    "flowjax>=19.1.1,<20",
    "jax>=0.8.2,<0.10",
    "jax2onnx>=0.14.0",
    "jaxwavelets==0.1.13",
    "jaxtyping>=0.3.5",
    "laplax==0.0.2",
    "lineax>=0.1.0,<0.2",
    "matfree>=0.6.1,<0.7",
    "manifold3d>=3.3.2",
    "meshio>=5.3.5",
    "nufftax>=0.6.1,<0.7",
    "numpy>=2.0",
    "opt-einsum>=3.4.0",
    "optax>=0.2.6",
    "orthax>=0.2.9,<0.3",
    "polars>=1.40.1",
    "pyvista>=0.46.4",
    "scipy>=1.14",
    "sympy>=1.14,<1.15",
    "s2fft>=1.4,<1.5",
    "setuptools<81",
    "shapely>=2.0",
    "tensorboard>=2.20.0",
    "trimesh[easy]>=4.11.1",
    "optimistix>=0.1.0",
    "qpax>=0.1.4",
    "h5py>=3.16.0",
]

[project.optional-dependencies]
clarabel = [
    "clarabel==0.11.1",
]
cudss = [
  "spineax>=0.0.5,<0.1; python_version >= '3.12' and sys_platform == 'linux' and platform_machine == 'x86_64'",
]
hdf5 = [
  "h5py>=3.11",
]
ipopt = [
  "cyipopt>=1.7,<2",
]
iree = [
  "iree-base-compiler==3.11.0",
  "iree-base-runtime==3.11.0",
]
docs = [
  "hippogriffe==0.2.2",
  "griffe==1.7.3",
  "mkdocs==1.6.1",
  "mkdocs-include-exclude-files==0.1.0",
  "mkdocs-material==9.6.7",
  "mkdocstrings==0.28.3",
  "mkdocstrings-python==1.16.8",
  "pymdown-extensions==10.14.3"
]
notebooks = [
    "marimo>=0.15.2",
    "matplotlib>=3.10.8",
]
tests = [
    "mpmath>=1.3",
    "PyWavelets>=1.8,<2",
    "pytest>=9.0.2",
    "pytest-clarity>=1.0.1",
    "pytest-impacted>=0.29.0",
    "pytest-rerunfailures>=16.1",
    "pytest-sugar>=1.1.1",
    "pytest-tia==1.1.1",
    "pytest-testmon>=2.2.0",
    "pytest-tia>=1.1.1",
    "pytest-xdist>=3.8.0",
]
qa = [
    "ruff==0.16.3",
    "scikit-learn>=1.4,<1.11",
    "ty==0.0.71",
]


[tool.ruff]
line-length = 90
exclude = [".*"]

[tool.ruff.lint]
select = ["E", "F", "I001"]
ignore = ["E402", "E721", "E731", "E741", "F722", "F841"]
fixable = ["I001", "F401"]

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2
order-by-type = false

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
filterwarnings = [
    "ignore::DeprecationWarning:ezdxf.queryparser:",
    "ignore::DeprecationWarning:build123d.objects_curve:",
    "ignore:Setting `jax_pmap_shmap_merge` is deprecated in JAX v0\\.9\\.0.*:DeprecationWarning:jax\\._src\\.config:",
]
