[tool.uv]
conflicts = [
  [
    {extra = "fmi"},
    {extra = "privacy-jax"},
  ],
]

[tool.uv.sources]
phydrax-meshcore = { path = "native/meshcore" }


[tool.ruff]
line-length = 90
exclude = [".*"]

[tool.ruff.lint]
# ANN0/ANN2 require every first-party function, method, and nested helper to
# annotate all parameters and its return type.
select = [
  "E",
  "F",
  "I001",
  "RUF100",
  "TID251",
  "ANN001",
  "ANN002",
  "ANN003",
  "ANN201",
  "ANN202",
  "ANN204",
  "ANN205",
  "ANN206",
]
ignore = ["E402", "E501", "E721", "E731", "E741", "F722"]
fixable = ["F401", "F841", "I001", "RUF100"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"opt_einsum".msg = "Use phydrax.ein; direct upstream imports are substrate-owner only."
"jax.numpy.einsum".msg = "Use phydrax.ein.contract for package contractions."
"jax.numpy.interp".msg = "Use phydrax interpolation with explicit support and bounds."
"jax.scipy.sparse.linalg".msg = "Use phydrax.linalg iterative solvers and status evidence."
"equinox.Module".msg = "Use phydrax._strict.StrictModule for Phydrax-owned modules."
"jax.experimental.hijax".msg = "HiJAX is experimental; package code must not depend on it."
"jax.lax.custom_root".msg = "Use phydrax._custom_root.custom_root; the HiJAX custom_root cannot be linearized under vmap."
"jaxtyping.Array".msg = "Import Array from jax."
"jaxtyping.ArrayLike".msg = "Import ArrayLike from jax.typing."
"jaxtyping.Key".msg = "Use phydrax.typing.PRNGKey for typed PRNG keys."
"jaxtyping.PRNGKeyArray".msg = "Use phydrax.typing.PRNGKey for typed PRNG keys."
"jaxtyping.Bool".msg = "Use the phydrax.typing tensor forms."
"jaxtyping.Complex".msg = "Use the phydrax.typing tensor forms."
"jaxtyping.Complex64".msg = "Use the phydrax.typing tensor forms."
"jaxtyping.Complex128".msg = "Use the phydrax.typing tensor forms."
"jaxtyping.Float".msg = "Use the phydrax.typing tensor forms."
"jaxtyping.Float16".msg = "Use the phydrax.typing tensor forms."
"jaxtyping.Float32".msg = "Use the phydrax.typing tensor forms."
"jaxtyping.Float64".msg = "Use the phydrax.typing tensor forms."
"jaxtyping.Inexact".msg = "Use the phydrax.typing tensor forms."
"jaxtyping.Int".msg = "Use the phydrax.typing tensor forms."
"jaxtyping.Int8".msg = "Use the phydrax.typing tensor forms."
"jaxtyping.Int16".msg = "Use the phydrax.typing tensor forms."
"jaxtyping.Int32".msg = "Use the phydrax.typing tensor forms."
"jaxtyping.Int64".msg = "Use the phydrax.typing tensor forms."
"jaxtyping.Integer".msg = "Use the phydrax.typing tensor forms."
"jaxtyping.Num".msg = "Use the phydrax.typing tensor forms."
"jaxtyping.Real".msg = "Use the phydrax.typing tensor forms."
"jaxtyping.Shaped".msg = "Use the phydrax.typing tensor forms."
"jaxtyping.UInt".msg = "Use the phydrax.typing tensor forms."
"jaxtyping.UInt8".msg = "Use the phydrax.typing tensor forms."
"jaxtyping.UInt16".msg = "Use the phydrax.typing tensor forms."
"jaxtyping.UInt32".msg = "Use the phydrax.typing tensor forms."
"jaxtyping.UInt64".msg = "Use the phydrax.typing tensor forms."

[tool.ruff.lint.per-file-ignores]
"phydrax/_strict.py" = ["TID251"]
"phydrax/ein/__init__.py" = ["TID251"]
"phydrax/tensor_network/_contraction.py" = ["TID251"]
"phydrax/tensor_network/_schedule.py" = ["TID251"]
"benchmarks/**/*.py" = ["TID251"]
"tests/**/*.py" = ["TID251"]
"tools/**/*.py" = ["TID251"]

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2
order-by-type = false

[tool.ruff.lint.pycodestyle]
max-line-length = 90

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = [
  "phydrax",
  "tests",
  "tools",
  "benchmarks",
  "examples",
  "mkdocstrings_setup.py",
  "native/meshcore/python",
]

[tool.ty.analysis]
# Only `ty: ignore[rule]` suppresses a diagnostic.
respect-type-ignore-comments = false
# Optional external providers, and compiled submodules without stubs, are `Any`
# at their import boundary, so the diagnostic set does not depend on which
# optional extras are installed.
replace-imports-with-any = [
  "arviz.**",
  "cryptography.**",
  "cvxpy.**",
  "dafoam.**",
  "design.**",
  "e3nn.**",
  "h5py.h5o",
  "mace.**",
  "manifold3d.**",
  "marimo.**",
  "mini_studies.**",
  "mpi4py.**",
  "open3d.**",
  "openmdao.**",
  "parameter_targets.**",
  "petsc4py.**",
  "psutil.**",
  "pyvista.**",
  "qdesignoptimizer.**",
  "qiskit_metal.**",
  "scikits.**",
  "sklearn.**",
  "sksparse.**",
  "sparseqr.**",
  "torch.**",
  "uproot.**",
  "win32api.**",
  "win32con.**",
  "win32job.**",
]

[tool.ty.rules]
# Equinox keeps an inherited custom `__init__` instead of synthesizing a
# dataclass constructor, and flattens fields in declaration order. The rule does
# not apply to such classes; reordering fields to satisfy it would change PyTree
# leaf order, fingerprints, filter specifications, and checkpoints.
dataclass-field-order = "ignore"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
strict = true
markers = [
    "opticstudio_live: requires a licensed local OpticStudio installation",
    "meshing_gmsh: requires the optional real Gmsh provider",
    "meshing_manifold: requires the optional real Manifold provider",
    "meshing_mmg: requires the real Mmg native worker",
    "meshing_ftetwild: requires the optional real fTetWild provider",
    "meshing_omega_h: requires the real Omega_h native worker",
    "meshing_vorocrust: requires the real VoroCrust mesher and extraction worker",
    "homotopy_continuation_live: requires an explicitly pinned Julia and HomotopyContinuation environment",
    "macaulay2_live: requires an explicitly pinned Macaulay2 executable",
    "typecheck: runs the pinned ty checker over static typing fixtures",
    "strict_jax: enforces strict dtype/rank promotion and warnings at native-JAX contract surfaces",
    "meshcore: requires the native phydrax-meshcore library (installed or PHYDRAX_MESHCORE_LIBRARY)",
]
filterwarnings = [
    "ignore::DeprecationWarning:ezdxf.queryparser:",
    "ignore::DeprecationWarning:build123d.objects_curve:",
    "ignore:Setting `jax_pmap_shmap_merge` is deprecated in JAX v0\\.9\\.0.*:DeprecationWarning:jax\\._src\\.config:",
]
