[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.32.4,<2"]

[tool.hatch.build]
artifacts = [
  "phydrax/nn/operator/pretrained/*.npz",
  "native/providers/**/*.cpp",
  "native/providers/**/*.hpp",
  "native/providers/**/CMakeLists.txt",
  "phydrax/backends/*.jl",
  "phydrax/backends/*.m2",
]
exclude = [
  ".venv/**",
  ".uv/**",
  ".uv-cache/**",
  ".pytest_cache/**",
  ".ruff_cache/**",
  "**/__pycache__/**",
  ".DS_Store",
]

# Native provider worker sources ship inside the wheel so installed users can
# build them; phydrax.meshing.providers.native_provider_source_path locates them.
[tool.hatch.build.targets.wheel.force-include]
"native/providers" = "phydrax/native/providers"

