[build-system]
requires = [
  "scikit-build-core>=1.1.0,<2",
  "cmake>=4.4.3,<5",
  "ninja>=1.13.2,<2",
  "jax>=0.11.2,<0.12",
  "jaxlib>=0.11.2,<0.12",
  "nvidia-cuda-nvcc-cu12>=12.9.86,<13",
  "nvidia-cuda-runtime-cu12>=12.9.79,<13",
  "nvidia-cuda-cccl-cu12>=12.9.27,<13",
  "nvidia-cublas-cu12>=12.9.2.10,<13",
  "nvidia-cusparse-cu12>=12.5.10.65,<13",
  "nvidia-cusolver-cu12>=11.7.5.82,<12",
  "nvidia-curand-cu12>=10.3.10.19,<11",
  "nvidia-nvjitlink-cu12>=12.9.86,<13",
  "nvidia-nvtx-cu12>=12.9.79,<13",
  "nvidia-nvml-dev-cu12>=12.9.79,<13",
  "nvidia-cuda-profiler-api-cu12>=12.9.79,<13",
  "nvidia-cudss-cu12>=0.8,<0.9",
]
build-backend = "_build_backend"
backend-path = ["."]

[project]
name = "phydrax-cuda12"
# Released in lockstep with phydrax, which pins and verifies this exact version.
version = "0.2.2"
description = "CUDA 12 native cuDSS, AmgX, and QUDA components for Phydrax (plain C ABI)."
requires-python = ">=3.12,<3.13"
authors = [{email = "leonard@phydra.ai", name = "Phydra Labs"}]
license = {text = "Phydra Non-Production License (PNPL)"}
dependencies = [
  "phydrax-cuda-major==12.*",
  "nvidia-cudss-cu12>=0.8,<0.9",
  "nvidia-cublas-cu12>=12.9.2.10,<13",
  "nvidia-cusparse-cu12>=12.5.10.65,<13",
  "nvidia-cusolver-cu12>=11.7.5.82,<12",
  "nvidia-curand-cu12>=10.3.10.19,<11",
  "nvidia-cuda-runtime-cu12>=12.9.79,<13",
  "nvidia-nvjitlink-cu12>=12.9.86,<13",
]

[tool.scikit-build]
minimum-version = "1.1"
cmake.version = ">=4.4.3,<5"
ninja.version = ">=1.13.2,<2"
cmake.build-type = "Release"
cmake.source-dir = "../cuda"
cmake.define.PHX_CUDA_MAJOR = "12"
# ctypes loads the component libraries without a CPython extension ABI.
wheel.py-api = "py3"
wheel.packages = ["python/phydrax_cuda12"]
# CMake installs the repository license notices into SKBUILD_METADATA_DIR/licenses.
# PEP 639 project.license-files cannot reference files outside this project root.
wheel.license-files = []
